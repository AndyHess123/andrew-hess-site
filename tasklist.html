<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="brand-mark">&#9670;</span><span class="brand-full">Andrew Hess</span></a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="videos.html">Videos</a>
      <a href="work.html">Work</a>
      <a href="contact.html">Contact</a>
      <button class="theme-toggle" type="button" aria-label="Toggle theme">&#9728;</button>
    </nav>
  </div>
</header>

<main id="main">

  <section class="section" style="padding-top: 12px;">
    <div class="wrap wrap-narrow">

      <form id="task-form" class="task-form">
        <input
          id="task-input"
          type="text"
          name="task"
          placeholder="Add a task&hellip;"
          autocomplete="off"
          maxlength="200"
          required
        >
        <input
          id="task-date"
          type="date"
          name="date"
          aria-label="Due date"
        >
        <select id="task-priority" name="priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button class="btn btn-primary" type="submit">Add</button>
      </form>

      <div class="view-toggle" role="group" aria-label="Switch view">
        <button class="view-btn is-active" type="button" data-view="list">&#9776; List</button>
        <button class="view-btn" type="button" data-view="calendar">&#128197; Calendar</button>
      </div>

      <div id="list-view" class="view-panel">
        <ul id="task-list" class="task-list"></ul>
        <p id="task-empty" class="state" hidden>No tasks yet &mdash; add one above.</p>
        <div class="task-toolbar">
          <div class="task-filters" role="group" aria-label="Filter tasks">
            <button class="filter-btn is-active" type="button" data-filter="all">All</button>
            <button class="filter-btn" type="button" data-filter="active">Active</button>
            <button class="filter-btn" type="button" data-filter="done">Done</button>
          </div>
          <button class="task-clear" id="clear-done" type="button">Clear completed</button>
        </div>
        <p class="task-count"><span id="task-count-text">0 tasks</span></p>
      </div>

      <div id="calendar-view" class="view-panel" hidden>
        <div class="cal-nav">
          <button class="cal-nav-btn" id="cal-prev" type="button" aria-label="Previous month">&#8592;</button>
          <h2 id="cal-title" class="cal-title">&nbsp;</h2>
          <button class="cal-nav-btn" id="cal-next" type="button" aria-label="Next month">&#8594;</button>
        </div>
        <div class="cal-weekdays">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
      </div>

    </div>
  </section>

</main>

<div id="task-modal-backdrop" class="task-modal-backdrop" hidden>
  <div class="task-modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-text">
    <p id="task-modal-text" class="task-modal-text"></p>
    <p id="task-modal-date" class="task-modal-date"></p>
    <button id="task-modal-close" class="task-modal-close" type="button">Close</button>
  </div>
</div>

<div id="edit-modal-backdrop" class="task-modal-backdrop" hidden>
  <div class="task-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <p id="edit-modal-title" class="task-modal-text">Edit task</p>
    <form id="edit-modal-form" class="edit-modal-form">
      <label class="edit-modal-label" for="edit-task-text">Task</label>
      <input id="edit-task-text" type="text" maxlength="200" required>

      <label class="edit-modal-label" for="edit-task-date">Due date</label>
      <input id="edit-task-date" type="date">

      <label class="edit-modal-label" for="edit-task-priority">Priority</label>
      <select id="edit-task-priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <div class="edit-modal-actions">
        <button id="edit-modal-cancel" class="task-modal-close task-modal-close-secondary" type="button">Cancel</button>
        <button class="task-modal-close" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
